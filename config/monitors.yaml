alert_after: 3
alert_on_degraded: false

monitors:
  - name: "DolarApi - Dolar Oficial"
    url: "https://dolarapi.com/v1/dolares/oficial"
    method: "GET"
    expected_status: 200
    max_latency_ms: 2500
    timeout_s: 5.0
    retries: 2
    backoff_base_s: 0.5
    contract: "dolar_api"

