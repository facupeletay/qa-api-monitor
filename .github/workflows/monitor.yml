name: Monitor de APIs y Publicación en GitHub Pages

on:
  schedule:
    # Corre cada 6 horas en el minuto 17 (00:17, 06:17, 12:17, 18:17 UTC)
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "qa-api-monitor-pages"
  cancel-in-progress: false

jobs:
  monitor-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12 con caché de pip
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar paquete y dependencias
        run: python -m pip install .

      - name: Ejecutar monitor de APIs (sin romper el job si un endpoint falla)
        id: run_monitor
        run: |
          set +e
          python -m monitor --config config/monitors.yaml --output results/run.json
          EXIT_CODE=$?
          echo "monitor_exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          echo "Monitor finalizó con código de salida: $EXIT_CODE"
          exit 0

      - name: Subir results/run.json como artifact de la corrida
        uses: actions/upload-artifact@v4
        with:
          name: monitor-run-result
          path: results/run.json
          retention-days: 14

      - name: Actualizar historial (merge con historial publicado en Pages)
        run: |
          python -m monitor.history \
            --previous "https://facupeletay.github.io/qa-api-monitor/history.json" \
            --run results/run.json \
            --output site/history.json

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir artifact del sitio para GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
