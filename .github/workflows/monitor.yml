name: Monitor de APIs y Publicación en GitHub Pages

on:
  schedule:
    # Corre cada 6 horas en el minuto 17 (00:17, 06:17, 12:17, 18:17 UTC)
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "qa-api-monitor-pages"
  cancel-in-progress: false

jobs:
  monitor-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7

      - name: Configurar Python 3.12 con caché de pip
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Instalar paquete y dependencias
        run: python -m pip install .

      - name: Ejecutar monitor de APIs y publicar resumen en el job
        id: run_monitor
        run: |
          set +e
          python -m monitor \
            --config config/monitors.yaml \
            --output results/run.json \
            --summary-md "$GITHUB_STEP_SUMMARY"
          EXIT_CODE=$?
          set -e
          echo "monitor_exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          if [ "$EXIT_CODE" -ne 0 ] && [ "$EXIT_CODE" -ne 1 ]; then
            echo "::error::El monitor falló por un error de configuración o interno (código $EXIT_CODE)."
            exit "$EXIT_CODE"
          fi
          echo "Monitor finalizó con código de salida controlado: $EXIT_CODE"

      - name: Subir results/run.json como artifact de la corrida
        uses: actions/upload-artifact@v7
        with:
          name: monitor-run-result
          path: results/run.json
          retention-days: 14

      - name: Actualizar historial (merge con historial publicado en Pages sin caché)
        run: |
          python -m monitor.history \
            --previous "https://facupeletay.github.io/qa-api-monitor/history.json?t=${{ github.run_id }}-${{ github.run_attempt }}" \
            --run results/run.json \
            --output site/history.json

      - name: Configurar Node.js con caché de npm
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Instalar dependencias del dashboard (npm ci)
        working-directory: dashboard
        run: npm ci

      - name: Compilar el dashboard estático (npm run build)
        working-directory: dashboard
        run: npm run build

      - name: Copiar history.json al directorio de salida del build
        run: cp site/history.json dashboard/dist/history.json

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6

      - name: Subir artifact del sitio para GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: dashboard/dist

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
